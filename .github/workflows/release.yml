name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build executables
        run: |
          python scripts/make_icon.py
          python -m PyInstaller --noconfirm --clean qslcard.spec

      - name: Self-test the frozen binaries
        shell: pwsh
        run: |
          $work = Join-Path $env:TEMP "qsl-release-selftest"
          $gui = Get-ChildItem dist -File -Filter *.exe | Where-Object { $_.BaseName -ne "qslcard-cli" } | Select-Object -First 1
          $proc = Start-Process -FilePath $gui.FullName -ArgumentList "--selftest", $work -Wait -PassThru
          Get-Content (Join-Path $work "selftest-report.json") -Raw
          if ($proc.ExitCode -ne 0) { throw "frozen self-test failed" }

      - name: Name the assets for download
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $gui = Get-ChildItem dist -File -Filter *.exe | Where-Object { $_.BaseName -ne "qslcard-cli" } | Select-Object -First 1
          Copy-Item $gui.FullName ("dist\QSL-Card-Manager-" + $version + "-win64.exe")
          Copy-Item "dist\qslcard-cli.exe" ("dist\qslcard-cli-" + $version + "-win64.exe")

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem dist -File -Filter "QSL-Card-Manager-*-win64.exe")
          $assets += @(Get-ChildItem dist -File -Filter "qslcard-cli-*-win64.exe")
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --generate-notes }
          foreach ($asset in $assets) { gh release upload $tag $asset.FullName --clobber }
          Write-Output ("uploaded " + $assets.Count + " assets for " + $tag)
