name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check qslcard tests scripts app_main.py
          ruff format --check qslcard tests scripts app_main.py
      - name: Test
        run: python -m pytest -q

  build-windows:
    name: Build Windows executables
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build
        run: python -m PyInstaller --noconfirm --clean qslcard.spec
      - name: Self-test the frozen binaries
        shell: pwsh
        run: |
          $work = Join-Path $env:TEMP 'qsl-selftest-ci'
          $gui = Get-ChildItem dist -File -Filter *.exe | Where-Object { $_.BaseName -ne 'qslcard-cli' } | Select-Object -First 1
          $proc = Start-Process -FilePath $gui.FullName -ArgumentList '--selftest', $work -Wait -PassThru
          Get-Content (Join-Path $work 'selftest-report.json') -Raw
          if ($proc.ExitCode -ne 0) { throw 'frozen self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: qslcard-windows
          path: dist/*.exe
